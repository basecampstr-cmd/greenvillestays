name: Weekly events refresh

# Regenerates the live events feed in index.html every Monday and commits it.
# Runs entirely on GitHub — no external server needed.
# Requires one repository secret: ANTHROPIC_API_KEY  (Settings > Secrets and variables > Actions).
# Optional repository variable: ANTHROPIC_MODEL (defaults to a current Claude model).

on:
  schedule:
    - cron: "0 11 * * 1"   # Mondays 11:00 UTC (~7am ET)
  workflow_dispatch: {}      # allows manual "Run workflow" from the Actions tab

permissions:
  contents: write

concurrency:
  group: refresh-events
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Refresh events in index.html
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
        run: node scripts/refresh-events.mjs

      - name: Commit and push if changed
        run: |
          if [ -n "$(git status --porcelain index.html)" ]; then
            git config user.name "Greenville Events Bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html
            git commit -m "Weekly events refresh (automated via GitHub Actions)"
            git push
            echo "Events updated and pushed."
          else
            echo "No event changes this week."
          fi
